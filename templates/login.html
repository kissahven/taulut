<!DOCTYPE html>
<html>

<head>
  <title>Taulut</title>
</head>

<body>
  <h1>Kirjautuminen</h1>
  <p>
    <a href="/logout">Kirjaudu ulos</a>
  </p>
  <form action="/login" method="post">
    <p>
      Tunnus: <br />
      <input type="text" name="username" />
    </p>
    <p>
      Salasana: <br />
      <input type="password" name="password" />
    </p>
    <input type="submit" value="Kirjaudu" />
  </form>
  <p> 
    Uusi käyttäjä?
    <a href="/register">Luo uusi käyttäjä</a>
  </p>
</body>

</html>
