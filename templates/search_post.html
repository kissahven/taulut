{% extends "layout.html" %}

{% block title %}Haku{% endblock %}

{% block content %}
    <a href="/home">Etusivulle</a>
    <h2>Haku</h2>
  
    <form action="/search_posts" method="get">
        <p>
            <label for="query">Hakukenttä</label>:
            <input type="text" name="query" id="query" value="{{ query }}">
            <input type="submit" value="Hae">
        </p>
    </form>

    {% if query %}
    <h3>Tulokset</h3>

    {% for result in results %}
     <div class="box">
        <a href="/post/{{result.id}}">{{result.title}}</a>
        <br>
        {{result.body}}
        <br>
    </div>
    <br>
    {% endfor %}
    {% endif %}
{% endblock %}
