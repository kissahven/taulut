{% extends "layout.html" %}

{% block title %}{{user.username}}{% endblock %}

{% block content %}
    <h1>{{user.username}}</h1>
  <h2>Käyttäjän postaukset</h2>
    <br>
    {%for post in posts %}
    <div class="box">
        <a href="/post/{{post.id}}">{{post.title}}</a>
        <br>
        {{post.body}}
    </div>
    <br>
    <br>
    {% endfor %}
{% endblock %}
